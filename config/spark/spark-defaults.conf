# Hadoop S3A FileSystem implementation
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem

# MinIO endpoint (internal Docker network)
spark.hadoop.fs.s3a.endpoint=http://minio:9000

# Path-style access (required for MinIO)
spark.hadoop.fs.s3a.path.style.access=true

# Disable SSL (local development)
spark.hadoop.fs.s3a.connection.ssl.enabled=false

# MinIO credentials (override via environment or code if needed)
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin

# S3A JARs (packaged in Airflow image at /opt/airflow/jars/)
spark.jars.packages=org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

# Performance tuning
spark.hadoop.fs.s3a.connection.maximum=100
spark.hadoop.fs.s3a.threads.max=64
spark.hadoop.fs.s3a.multiobjectdelete.enable=true
spark.hadoop.fs.s3a.fast.upload=true

version: "3.8"

x-airflow-env: &airflow_env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: "or5bRDKaMSkEstLBdxSzUE_NMabavbFmkWTtmXJYtic="

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done &&
       /usr/bin/mc mb -p local/datalake || true &&
       [ -d /seed ] && /usr/bin/mc cp -r /seed/ local/datalake/raw/recife/ || true"
    volumes:
      - ./data/raw:/seed:ro

  spark-master:
    image: apache/spark:3.4.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports: ["7077:7077", "8080:8080"]
    volumes:
      - ./app:/opt/app
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/conf/core-site.xml:/opt/spark/conf/core-site.xml

  spark-worker:
    image: apache/spark:3.4.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on: [spark-master]
    volumes:
      - ./app:/opt/app
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./spark/conf/core-site.xml:/opt/spark/conf/core-site.xml

  airflow-init:
    build: ./airflow
    image: airflow-with-spark:2.10.2-3.4.0
    entrypoint: ["/bin/bash", "-c"]
    environment:
      <<: *airflow_env
    command: >
      "airflow db upgrade &&
       airflow users create --role Admin --username admin --password admin --firstname A --lastname F --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    build: ./airflow
    image: airflow-with-spark:2.10.2-3.4.0
    environment:
      <<: *airflow_env
    command: webserver
    ports: ["8088:8080"]
    depends_on:
      - airflow-init
      - postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./app:/opt/app
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-scheduler:
    build: ./airflow
    image: airflow-with-spark:2.10.2-3.4.0
    environment:
      <<: *airflow_env
    command: scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./app:/opt/app

volumes:
  minio-data:


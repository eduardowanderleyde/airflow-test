# Configuração do Ruff (linter Python)
# https://docs.astral.sh/ruff/

target-version = "py311"
line-length = 100
indent-width = 4

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "ISC", # flake8-implicit-str-concat
    "T20", # flake8-print (warnings, não errors)
    "PL",  # pylint
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "T201",   # print statements (ok em jobs Spark)
    "PLR0913", # too many arguments (ok em funções Spark)
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports ok em __init__
"airflow/dags/*.py" = ["T201"]  # print ok em DAGs para logs

